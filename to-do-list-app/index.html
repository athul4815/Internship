<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>To-Do List</h1>

  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Enter a task to the list">
    <button id="addTaskBtn">Add Task</button>
  </div>


  <div class="counters">
    <span id="totalCount">Total: 0</span>
    <span id="completedCount">Completed: 0</span>
  </div>

 
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <ul id="taskList"></ul>

  <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
</div>

<script src="script.js"></script>
</body>
</html>
